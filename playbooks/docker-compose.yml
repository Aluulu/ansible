---
- name: Deploy AdGuard
  hosts: zoro

  tasks:
    - name: Copy AdGuard Compose file
      ansible.builtin.copy:
        src: ../files/docker/adguard-server.yaml
        dest: "{{ ansible_facts['env']['HOME'] }}/compose.yaml"
        mode: '0644'

    - name: Start AdGuard
      community.docker.docker_compose_v2:
        project_src: "{{ ansible_facts['env']['HOME'] }}"
        files:
          - compose.yaml
        state: present


